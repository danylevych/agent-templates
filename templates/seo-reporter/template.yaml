id: seo-reporter
name: SEO Performance Reporter
category: marketing
icon: search
description: >-
  Reports on search and site performance from Search Console and Google Analytics: what grew,
  what dropped and which pages need attention.
useCases:
  - Compare clicks, impressions and position with the previous period
  - Find pages and queries that dropped
  - Check indexing issues
  - Build a monthly report as a spreadsheet or a short deck
status: published

required_tools:
  - mcp.google-search-console.read_only
  - mcp.google-analytics.read_only
  - skill.spreadsheet
  - skill.slides
