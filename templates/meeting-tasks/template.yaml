id: meeting-tasks
name: Meeting Notes to Tasks
category: ops
icon: calendar
description: >-
  Reads your meetings and their notes in Google Docs, pulls out the action items with owners
  and due dates, and creates Jira issues after you confirm.
useCases:
  - Find yesterday's meetings and the notes linked to them
  - List action items with owners and due dates
  - Create a Jira issue for each one, after you confirm
status: published

required_tools:
  - mcp.google-calendar.read_only
  - mcp.google-docs.read_only
  - mcp.atlassian.read_write
